<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Break Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <h1>YouTube Break Reminder</h1>
      </div>
    </header>

    <!-- タブナビゲーション -->
    <nav class="tab-nav">
      <button id="tab-timer" class="tab-btn active">タイマー・設定</button>
      <button id="tab-report" class="tab-btn">利用レポート</button>
    </nav>

    <!-- タイマー・設定タブ -->
    <main id="timer-section" class="tab-content">
      <div class="stats-card">
        <div class="progress-container">
          <svg class="progress-ring" width="120" height="120">
            <circle class="progress-ring__circle-bg" stroke="var(--border-color)" stroke-width="6" fill="transparent" r="50" cx="60" cy="60"/>
            <circle class="progress-ring__circle" stroke="var(--accent-color)" stroke-width="6" stroke-linecap="round" fill="transparent" r="50" cx="60" cy="60"/>
          </svg>
          <div class="progress-text">
            <span id="current-time">0m</span>
            <span class="label">利用時間</span>
          </div>
        </div>

        <div class="time-details">
          <div class="time-item">
            <span class="time-label">今日の残り時間</span>
            <span id="remaining-time" class="time-value">--s</span>
          </div>
          <div class="time-item" style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
            <span class="time-label">現在の連続利用時間</span>
            <span id="continuous-time" class="time-value" style="color: var(--text-secondary);">--s</span>
          </div>
        </div>
      </div>

      <!-- 設定エリア -->
      <div class="settings-card">
        <h2>設定</h2>
        
        <div class="form-group">
          <label>曜日・祝日別の制限時間</label>
          <div class="limit-grid">
            <div class="limit-grid-item">
              <label for="limit-hours-1">月</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-1" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-1" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item">
              <label for="limit-hours-5">金</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-5" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-5" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item">
              <label for="limit-hours-2">火</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-2" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-2" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item">
              <label for="limit-hours-6">土</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-6" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-6" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item">
              <label for="limit-hours-3">水</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-3" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-3" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item">
              <label for="limit-hours-0">日</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-0" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-0" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item">
              <label for="limit-hours-4">木</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-4" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-4" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
            <div class="limit-grid-item highlight-holiday">
              <label for="limit-hours-H">祝</label>
              <div class="limit-input-group">
                <input type="number" id="limit-hours-H" min="0" max="23" value="1">
                <span>h</span>
                <input type="number" id="limit-minutes-H" min="0" max="59" value="30">
                <span>m</span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="break-interval">連続利用の休憩間隔</label>
          <div class="input-row">
            <input type="number" id="break-interval" min="5" max="180" value="30">
            <span>分ごと</span>
          </div>
        </div>

        <div class="form-group">
          <label for="reset-hour">リセット時刻 (24時間表記)</label>
          <div class="input-row">
            <input type="number" id="reset-hour" min="0" max="23" value="4">
            <span>時</span>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="debug-enabled">
          <label for="debug-enabled">デバッグ画面を表示する</label>
        </div>

        <button id="save-btn" class="save-btn">設定を保存</button>
        <div id="save-status" class="save-status">設定を保存しました</div>
      </div>
    </main>

    <!-- 利用レポートタブ -->
    <main id="report-section" class="tab-content" style="display: none;">
      <!-- 期間セレクター (日別/週別/月別) -->
      <div class="view-switcher">
        <button id="view-daily" class="view-btn active">日別</button>
        <button id="view-weekly" class="view-btn">週別</button>
        <button id="view-monthly" class="view-btn">月別</button>
      </div>

      <!-- 日付ナビゲーション -->
      <div class="date-navigator">
        <button id="prev-date-btn" class="nav-arrow-btn" title="前へ">◀</button>
        <span id="date-display-label" class="date-label">----/--/--</span>
        <button id="next-date-btn" class="nav-arrow-btn" title="次へ">▶</button>
        <button id="today-btn" class="today-badge-btn">今日</button>
      </div>

      <!-- サマリー統計カード -->
      <div class="report-summary-grid">
        <div class="summary-card">
          <span class="summary-title" id="summary-title-total">総視聴時間</span>
          <span class="summary-value" id="report-total-time">0分</span>
        </div>
        <div class="summary-card">
          <span class="summary-title" id="summary-title-avg">1日平均</span>
          <span class="summary-value" id="report-avg-time">--</span>
        </div>
        <div class="summary-card full-width">
          <span class="summary-title">最も視聴した時間帯</span>
          <span class="summary-value highlight" id="report-peak-hour">なし</span>
        </div>
      </div>

      <!-- 24時間別チャート -->
      <div class="report-chart-card">
        <div class="chart-header">
          <h3>時間帯別の視聴時間</h3>
          <span id="hourly-chart-sub" class="chart-sub">24時間分布</span>
        </div>
        <div class="hourly-chart-container">
          <div id="hourly-chart" class="hourly-chart"></div>
          <div class="hourly-axis">
            <span>0時</span>
            <span>6時</span>
            <span>12時</span>
            <span>18時</span>
            <span>23時</span>
          </div>
        </div>
        <div id="hourly-tooltip" class="chart-tooltip">バーをタップ/ホバーで詳細表示</div>
      </div>

      <!-- 日別推移チャート（週別・月別用） -->
      <div id="trend-chart-card" class="report-chart-card" style="display: none;">
        <div class="chart-header">
          <h3 id="trend-chart-title">日別の推移</h3>
        </div>
        <div class="trend-chart-container">
          <div id="trend-chart" class="trend-chart"></div>
        </div>
        <div id="trend-tooltip" class="chart-tooltip">各日の利用時間</div>
      </div>

      <!-- データ管理（リセット等） -->
      <div class="history-actions">
        <button id="clear-history-btn" class="secondary-btn">履歴データを全消去</button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
